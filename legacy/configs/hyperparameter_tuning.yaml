# Hyperparameter tuning configuration for FinGAT
# Based on paper's search space

# Tuning mode settings
tuning:
  enabled: true
  method: 'grid'  # Options: 'grid', 'random', 'bayesian'
  num_trials: 50  # For random/bayesian search
  metric: 'val_MRR@10'  # Metric to optimize
  direction: 'maximize'  # 'maximize' or 'minimize'
  
# Search spaces (based on paper)
search_space:
  # Model hyperparameters
  model:
    hidden_dim:
      type: 'choice'
      values: [8, 16, 32, 64]  # Paper tested these values, 16 was best
      
    dropout:
      type: 'choice'
      values: [0.1, 0.2, 0.3, 0.4]
      
    num_weeks:
      type: 'choice'
      values: [2, 3, 4]  # Paper: t ≥ 3 works best
  
  # Training hyperparameters
  training:
    learning_rate:
      type: 'choice'
      values: [0.0005, 0.001, 0.005]  # Paper search space
      
    batch_size:
      type: 'choice'
      values: [32, 64, 128, 256]
      
    # Loss weights - paper found δ=0.01 optimal
    movement_weight:
      type: 'choice'
      values: [0.001, 0.01, 0.05, 0.1]  # δ values
      
    l2_lambda:
      type: 'choice'
      values: [1e-5, 1e-4, 1e-3]  # L2 regularization
      
    # Optimizer settings
    weight_decay:
      type: 'choice'
      values: [0, 1e-5, 1e-4, 1e-3]
      
    gradient_clip:
      type: 'choice'
      values: [0.5, 1.0, 5.0, null]

# Grid search specific (all combinations)
grid_search:
  # Define specific combinations to test
  configurations:
    - name: 'paper_recommended'
      hidden_dim: 16
      learning_rate: 0.001
      batch_size: 128
      movement_weight: 0.01
      l2_lambda: 1e-4
      
    - name: 'small_model'
      hidden_dim: 8
      learning_rate: 0.001
      batch_size: 64
      movement_weight: 0.01
      l2_lambda: 1e-4
      
    - name: 'large_model'
      hidden_dim: 32
      learning_rate: 0.0005
      batch_size: 256
      movement_weight: 0.01
      l2_lambda: 1e-4
      
    - name: 'high_movement_weight'
      hidden_dim: 16
      learning_rate: 0.001
      batch_size: 128
      movement_weight: 0.1
      l2_lambda: 1e-4
      
    - name: 'no_regularization'
      hidden_dim: 16
      learning_rate: 0.001
      batch_size: 128
      movement_weight: 0.01
      l2_lambda: 0

# Random search specific
random_search:
  num_samples: 50
  seed: 42

# Bayesian optimization specific
bayesian_optimization:
  num_initial_points: 10
  acquisition_function: 'EI'  # Expected Improvement
  
# Training settings for tuning (reduced for faster iteration)
tuning_training:
  epochs: 30  # Reduced from 100 for faster tuning
  early_stopping: true
  patience: 5  # Reduced patience
  
# Resource allocation
resources:
  gpus_per_trial: 0.5  # For parallel trials
  cpus_per_trial: 2
  
# Output settings
output:
  results_dir: 'hyperparameter_tuning_results/'
  save_all_models: false  # Only save best
  save_top_k: 3  # Save top-k best models