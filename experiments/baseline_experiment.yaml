# Experiment Configuration Template

# Experiment metadata
experiment:
  name: "fingat_vietnam_exp1"
  description: "Baseline FinGAT experiment on Vietnam market data"
  author: "Research Team"
  created_date: "2024-01-01"

  # Experiment type
  type: "baseline"  # baseline, ablation, hyperparameter_search

# Specific configurations for this experiment
config_overrides:
  # Override default config values
  training:
    batch_size: 64
    learning_rate: 0.0005
    num_epochs: 150

  model:
    temporal:
      hidden_size: 256
      num_layers: 3

# Ablation study settings (if type = "ablation")
ablation:
  components_to_remove:
    - "temporal_attention"
    - "intra_sector_gat"  
    - "inter_sector_gat"

# Notes and observations
notes: |
  This experiment tests the baseline FinGAT model with:
  - 400 Vietnam stocks (2018-2023)
  - HOSE sector groupings
  - 30-day sequences
  - Multi-task learning (ranking + movement prediction)

# Expected results
expected_results:
  mrr_at_10: 0.15
  accuracy: 0.55
  precision_at_10: 0.12
